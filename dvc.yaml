stages:
  modelado:
    wdir: .
    cmd: python -m kedro run --pipeline=modelado
    deps:
      - src/proyecto_ml/pipelines/modelado/nodes.py
      - src/proyecto_ml/pipelines/modelado/pipeline.py
      - conf/base/parameters.yml
      - conf/base/catalog.yml
      - data/03_primary/dataset_con_features_temporales.csv
    outs:
      - data/07_model_output/metricas_modelos.csv
      - data/07_model_output/comparacion_y_real_vs_pred.csv
      - data/07_model_output/probabilidades.csv
      - data/06_models/mejor_modelo.pkl
    metrics:
      - data/07_model_output/metricas_modelos.csv

  clustering_kmeans:
    cmd: python scripts/run_unsupervised.py --step kmeans
    deps:
      - scripts/run_unsupervised.py
      - conf/base/parameters.yml
      - conf/base/catalog.yml
      - data/03_primary/dataset_con_features_temporales.csv
    outs:
      - data/07_model_output/clustering/kmeans_labels.csv
    metrics:
      - data/07_model_output/clustering/metrics_kmeans.csv
      - data/07_model_output/clustering/elbow_kmeans.csv

  clustering_dbscan:
    cmd: python scripts/run_unsupervised.py --step dbscan
    deps:
      - scripts/run_unsupervised.py
      - conf/base/parameters.yml
      - conf/base/catalog.yml
      - data/03_primary/dataset_con_features_temporales.csv
    outs:
      - data/07_model_output/clustering/dbscan_labels.csv
    metrics:
      - data/07_model_output/clustering/metrics_dbscan.csv

  clustering_hier:
    cmd: python scripts/run_unsupervised.py --step hier
    deps:
      - scripts/run_unsupervised.py
      - conf/base/parameters.yml
      - conf/base/catalog.yml
      - data/03_primary/dataset_con_features_temporales.csv
    outs:
      - data/07_model_output/clustering/hier_labels.csv
      - data/07_model_output/clustering/dendrogram_hier.pkl
    metrics:
      - data/07_model_output/clustering/metrics_hier.csv

  clustering_gmm:
    cmd: python scripts/run_unsupervised.py --step gmm
