version: "3.8"

services:
  airflow-db:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 5
    volumes:
      - airflow-db:/var/lib/postgresql/data
    restart: unless-stopped

  airflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      TZ: America/Santiago
      AIRFLOW_UID: "${AIRFLOW_UID:-50000}"
      HOME: /home/airflow
      AIRFLOW__LOGGING__HOSTNAME_CALLABLE: "airflow.utils.net.get_host_ip_address"
      AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT: "8793"
      GITHUB_USER: "${GITHUB_USER}"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL}"
      AIRFLOW_BASE_URL: "${AIRFLOW_BASE_URL}"
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "8080:8080"
      - "8793:8793"
    volumes:
      - ../dags:/opt/airflow/dags
      - ..:/opt/airflow/proyecto-ml
      - ../secrets:/opt/airflow/proyecto-ml/secrets
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      bash -lc "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname A --lastname F --role Admin --email admin@example.com || true &&
      airflow webserver & airflow scheduler
      "
    restart: unless-stopped

volumes:
  airflow-db: