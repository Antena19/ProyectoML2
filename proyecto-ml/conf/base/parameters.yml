# Parámetros del Proyecto ML - Defunciones y Nacimientos
# Configuración externa para flexibilidad y mejores prácticas

# Configuración de datos
datos:
  años_inicio: 2014
  años_fin: 2023
  columnas_obligatorias:
    - "año"
    - "fecha_defuncion"
    - "sexo"
    - "edad_cantidad"
    - "region"
  umbral_completitud: 0.95
  umbral_duplicados: 0.05

# Configuración de limpieza de datos
limpieza:
  estrategia_fechas_nulas: "imputacion_media_anual"
  eliminar_duplicados: true
  eliminar_geograficos_nulos: true
  validar_rango_fechas: true

# Configuración de features temporales
features_temporales:
  ciclicos:
    - "mes"
    - "dia_año"
    - "trimestre"
    - "dia_semana"
  especiales:
    - "es_fin_semana"
    - "es_invierno"
    - "es_verano"
    - "trimestre_fiscal"
  basicas:
    - "año_normalizado"
    - "epoca_año_codificada"
    - "decada"

# Configuración de normalización
normalizacion:
  metodos:
    - "StandardScaler"
    - "MinMaxScaler"
    - "RobustScaler"
  variables_numericas:
    - "tipo_edad"
    - "edad_cantidad"
    - "año_fecha"
    - "mes"
    - "trimestre"
    - "dia_año"
  metodo_principal: "StandardScaler"

# Configuración de datasets finales
datasets_finales:
  regresion:
    # SOLO predecir EDAD_CANTIDAD (edad de fallecimiento)
    # Objetivo: Identificar patrones temporales, geográficos, de género y de causa de muerte
    # IMPORTANTE: NO incluir variables derivadas de edad (data leakage)
    variables_objetivo:
      - "edad_cantidad"  # Predecir edad de fallecimiento (0-100+ años)
    
    # Variables predictoras LIMPIAS (sin data leakage)
    # SOLO variables independientes de la edad
    variables_predictoras:
      # ⭐ CAUSA DE MUERTE (CIE-10) - VARIABLE MÁS IMPORTANTE
      - "codigo_diagnostico"  # Capítulo CIE-10 (I00-I99, C00-D48, etc.)
      
      # Features demográficos (INDEPENDIENTES de edad)
      - "sexo"  # Hombre/Mujer
      - "region"  # Región geográfica (17 regiones)
      
      # Features temporales cíclicos (estacionalidad)
      - "mes_sin"
      - "mes_cos"
      - "dia_año_sin"
      - "dia_año_cos"
      - "trimestre_sin"
      - "trimestre_cos"
      - "dia_semana_sin"
      - "dia_semana_cos"
      
      # Features estacionales (mortalidad diferencial por estación)
      - "es_fin_semana"
      - "es_invierno"
      - "es_verano"
      - "es_primavera"
      - "es_otono"
      
      # Features temporales adicionales
      - "trimestre_fiscal"
      - "epoca_año_codificada"
      - "decada"
      
      # Features geográficos (acceso a salud varía por región)
      - "es_norte"
      - "es_centro"
      - "es_sur"
  
  clasificacion:
    # SOLO clasificación de SEXO (binario: Hombre/Mujer)
    variables_objetivo:
      - "sexo"
    
    # Variables predictoras optimizadas para clasificación de sexo
    # Basadas en patrones epidemiológicos de mortalidad diferencial
    variables_predictoras:
      - "edad_cantidad"
      - "mes_sin"
      - "mes_cos"
      - "dia_año_sin"
      - "dia_año_cos"
      - "trimestre_sin"
      - "trimestre_cos"
      - "dia_semana_sin"
      - "dia_semana_cos"
      - "es_fin_semana"
      - "es_invierno"

# Configuración de modelado de Machine Learning
modelado:
  # Configuración general
  test_size: 0.2  # 20% para test, 80% para train
  random_state: 42  # Semilla para reproducibilidad
  cv_folds: 5  # K=5 para CrossValidation (mínimo requerido por rúbrica)
  n_jobs: -1  # Usar todos los cores disponibles
  verbose: 1  # Nivel de verbosidad en GridSearchCV
  sample_size_ml: 100000  # Muestra estratificada para acelerar entrenamiento (100K registros)
  
  # Configuración de clasificación
  clasificacion:
    variables_objetivo:
      - "sexo"  # Clasificación binaria: Hombre/Mujer
    variables_predictoras:
      # SOLO VARIABLES RELEVANTES PARA CLASIFICACION DE SEXO (11 variables)
      
      # Variables principales de edad
      - "edad_cantidad"              # Edad de fallecimiento (principal)
      - "edad_normalizada"           # Edad normalizada 0-1
      
      # Variables específicas de sexo (basadas en patrones epidemiológicos)
      - "desviacion_edad_hombres"    # Desviación respecto a edad promedio de hombres
      - "desviacion_edad_mujeres"    # Desviación respecto a edad promedio de mujeres
      - "riesgo_mortalidad_joven"    # Indicador de riesgo joven (más hombres)
      - "riesgo_mortalidad_adulto"   # Indicador de riesgo adulto
      - "riesgo_mortalidad_mayor"    # Indicador de riesgo mayor (más mujeres)
      
      # Categorías de edad (informativas)
      - "es_menor_edad"              # Menor de 18 años
      - "es_adulto_joven"            # 18-30 años
      - "es_adulto_maduro"           # 30-65 años
      - "es_adulto_mayor"            # 65+ años
  
  # Configuración de regresión
  regresion:
    variables_objetivo:
      - "edad_cantidad"  # Predecir edad de fallecimiento
      - "año_normalizado"  # Predecir año normalizado
    variables_predictoras:
      - "mes_sin"
      - "mes_cos"
      - "dia_año_sin"
      - "dia_año_cos"
      - "trimestre_sin"
      - "trimestre_cos"
      - "dia_semana_sin"
      - "dia_semana_cos"
      - "es_fin_semana"
      - "es_invierno"
      - "es_verano"
      - "trimestre_fiscal"
      - "epoca_año_codificada"
  
  # Rutas de guardado
  ruta_modelos: "data/06_models"
  ruta_resultados: "data/07_model_output"
  
  # Métricas principales
  metricas_clasificacion:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "roc_auc"
  
  metricas_regresion:
    - "mae"
    - "mse"
    - "rmse"
    - "r2"
    - "mape"

# Configuración de reportes
reportes:
  calidad:
    metricas_requeridas:
      - "completitud"
      - "duplicados"
      - "valores_nulos"
      - "consistencia_temporal"
    umbrales_alerta:
      completitud_minima: 0.90
      duplicados_maximo: 0.10
      valores_nulos_maximo: 0.05
  
  visualizaciones:
    formato_imagen: "png"
    dpi: 300
    estilo: "default"
    paleta_colores: "husl"
    tamaño_figura:
      ancho: 12
      alto: 8

# Configuración de validación
validacion:
  checks_calidad:
    - "verificar_completitud"
    - "verificar_duplicados"
    - "verificar_rango_fechas"
    - "verificar_valores_nulos"
    - "verificar_consistencia_temporal"
  
  umbrales_validacion:
    completitud_minima: 0.95
    duplicados_maximo: 0.05
    valores_nulos_maximo: 0.03

# Configuración de logging
logging:
  nivel: "INFO"
  formato: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  archivo_log: "info.log"
  max_bytes: 10485760  # 10MB
  backup_count: 20

# Configuración de performance
performance:
  chunk_size: 10000
  max_memory_usage: "2GB"
  parallel_processing: false
  cache_intermediate_results: true

# Configuración de paths
paths:
  datos_raw: "data/01_raw"
  datos_intermediate: "data/02_intermediate"
  datos_primary: "data/03_primary"
  datos_feature: "data/04_feature"
  datos_model_input: "data/05_model_input"
  reportes: "data/08_reporting"
  logs: "logs"
  modelos: "data/06_models"
  salidas_modelos: "data/07_model_output"
